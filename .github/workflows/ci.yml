name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Install
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[all,socks]" --group dev
      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Type check
        run: uv run --no-sync mypy
      - name: Tests
        run: uv run --no-sync pytest --cov=proxy_pool --cov-report=term

  core-only:
    name: Core without optional dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv venv --python 3.12 && uv pip install -e . pytest
      - name: Import the core with no extras installed
        run: uv run --no-sync python -c "import proxy_pool, proxy_pool.quanticdata; print(proxy_pool.__version__)"
      - run: uv run --no-sync pytest tests/test_proxy.py tests/test_pool.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uvx twine check dist/*
