[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "proxy-pool"
version = "0.1.0"
description = "Rotating and sticky proxy pool for Python: health checks, ban detection, exponential backoff, with adapters for requests, httpx and Scrapy."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["proxy", "proxy-pool", "rotating-proxy", "sticky-session", "scrapy", "requests", "httpx", "web-scraping"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Scrapy",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]

[project.optional-dependencies]
requests = ["requests>=2.34.2"]
httpx = ["httpx>=0.28.1,<1"]
scrapy = ["scrapy>=2.19.0"]
socks = ["requests[socks]>=2.34.2", "httpx[socks]>=0.28.1,<1"]
all = ["requests>=2.34.2", "httpx>=0.28.1,<1", "scrapy>=2.19.0"]

[project.urls]
Homepage = "https://github.com/quanticdata-io/proxy-pool"
Documentation = "https://github.com/quanticdata-io/proxy-pool#readme"
Issues = "https://github.com/quanticdata-io/proxy-pool/issues"
Changelog = "https://github.com/quanticdata-io/proxy-pool/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "mypy>=2.4.1",
  "ruff>=0.17.5",
  "types-requests>=2.33.0.20261030",
]

[tool.hatch.build.targets.wheel]
packages = ["src/proxy_pool"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "C4", "RET"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0911", "PLC0415"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "examples"]

[[tool.mypy.overrides]]
module = ["scrapy.*", "twisted.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
